[FilterPlugin]
; This section lists additional files which will be packaged along with your plugin. Paths should be listed relative to the root plugin directory, and
; may include "...", "*", and "?" wildcards to match directories, files, and individual characters respectively.
;
; Examples:
;    /README.txt
;    /Extras/...
;    /Binaries/ThirdParty/*.dll

; The plugin ships its own git-lfs binaries at the plugin root (see GIT_USE_CUSTOM_LFS in
; GitSourceControlUtils.cpp). BuildPlugin does not copy loose root files, so list them here
; or the packaged plugin fails every LFS lock/locks command at runtime.
/git-lfs.exe
/git-lfs
/git-lfs-mac-amd64
/git-lfs-mac-arm64
